<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Code</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        .card {

            background: #ffffff;

            padding: 45px;

            border-radius: 35px;

            border: 1px solid #dbe4f0;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, .06);

        }

        .header {

            margin-bottom: 30px;

        }

        h1 {

            font-size: 42px;

            font-weight: 800;

            color: #1e3a8a;

            margin-bottom: 10px;

        }

        .subtitle {

            font-size: 16px;

            font-weight: 600;

            color: #3b82f6;

        }

        .description {

            margin-top: 30px;

            font-size: 16px;

            line-height: 1.8;

            color: #475569;

        }

        .alert {

            margin-top: 30px;

            padding: 18px;

            background: #eff6ff;

            border-left: 5px solid #3b82f6;

            border-radius: 18px;

            font-size: 15px;

            line-height: 1.6;

            color: #1d4ed8;

        }

        .code-container {

            text-align: center;

            margin-top: 40px;

            margin-bottom: 40px;

        }

        .code {

            display: inline-block;

            background: #f8fafc;

            padding: 25px 40px;

            border: 2px solid #bfdbfe;

            border-radius: 24px;

            font-size: 42px;

            font-family: monospace;

            font-weight: 900;

            letter-spacing: 12px;

            color: #0f172a;

            min-width: 320px;

        }

        .footer {

            margin-top: 35px;

            padding-top: 25px;

            border-top: 1px solid #e2e8f0;

            text-align: center;

            font-size: 14px;

            color: #64748b;

            line-height: 1.7;

        }

        @media(max-width:600px) {

            .card {

                padding: 30px;

            }

            h1 {

                font-size: 32px;

            }

            .code {

                width: 100%;

                min-width: 100%;

                padding: 20px;

                font-size: 30px;

                letter-spacing: 8px;

            }

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <h1>Security Code</h1>

                <div class="subtitle">
                    Password Recovery
                </div>

            </div>

            <div class="description">

                Use the verification code below to continue your password recovery process.

            </div>

            <div class="alert">

                This code is private and valid for 30 minutes. Never share it with anyone.

            </div>

            <div class="code-container">

                <div class="code">

                    {{ code }}

                </div>

            </div>

            <div class="footer">

                If you did not request this action, you can safely ignore this email.

            </div>

        </div>

    </div>

</body>

</html>
