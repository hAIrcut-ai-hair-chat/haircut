<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Code</title>

    <style>
        :root {
            --bg: #0b0f14;
            --bg2: #737373;
            --card: #111826;
            --card-2: #0f1623;
            --border: rgba(255, 255, 255, 0.06);
            --text: #e6e6e6;
            --muted: #9aa4b2;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
            --hover: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            padding: 40px 20px;
            border: 1px solid var(--bg);
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: var(--card);
            padding: 45px;
            border-radius: 35px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 45px rgba(0, 0, 0, .45);
        }

        .header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            color: var(--blue);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 600;
            color: var(--muted);
        }

        .description {
            margin-top: 30px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text);
        }

        .alert {
            margin-top: 30px;
            padding: 18px;
            background: var(--card-2);
            border-left: 5px solid var(--blue);
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
        }

        .code-container {
            text-align: center;
            margin: 40px 0;
        }

        .code {
            display: inline-block;
            background: var(--card-2);
            padding: 25px 40px;
            border: 2px solid var(--blue);
            border-radius: 24px;
            font-size: 42px;
            font-family: monospace;
            font-weight: 900;
            letter-spacing: 12px;
            color: var(--text);
            min-width: 320px;
        }

        .footer {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 14px;
            color: var(--muted);
            line-height: 1.7;
        }

        @media (max-width: 600px) {

            .card {
                padding: 30px;
            }

            h1 {
                font-size: 32px;
            }

            .code {
                width: 100%;
                min-width: 100%;
                padding: 20px;
                font-size: 30px;
                letter-spacing: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">
                <h1>Security Code</h1>
                <div class="subtitle">
                    Password Recovery
                </div>
            </div>

            <div class="description">
                Use the verification code below to continue your password recovery process.
            </div>

            <div class="alert">
                This code is private and valid for 30 minutes. Never share it with anyone.
            </div>

            <div class="code-container">
                <div class="code">
                    {{ code }}
                </div>
            </div>

            <div class="footer">
                If you did not request this action, you can safely ignore this email.
            </div>

        </div>

    </div>

</body>

</html>
